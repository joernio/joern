name: upgrade-deps
# Nightly job that verifies that we can upgrade all internal dependencies
# This essentially runs `./updateDependencies.sh --non-interactive` and
# runs the regular tests, to notify us if some upstream dependency
# introduced breaking changes. If it's red, that's not the end of the
# world, but we should get it back on track to unblock others. 
on: 
  schedule:
    - cron: '0 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.1"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rust-src
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - name: Upgrade all (internal) dependencies
        run: ./updateDependencies.sh --non-interactive
      - run: sbt "testFull"
      - name: Integration tests
        run: sbt "c2cpg/stage ; integrationTests/testFull"
      - name: Test distribution
        run: |
          python -m pip install pexpect
          sbt "joerncli/stage ; querydb/createDistribution"
          python -u ./testDistro.py
