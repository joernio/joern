name: pr
on: pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
      - name: Fetch base branch with depth 100
        run: git fetch --depth=100 origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Check formatting and lint
        run: sbt "scalafmtCheck ; Test/scalafmtCheck ; integrationTests/scalafmtCheck ; integrationTests/Test/scalafmtCheck ; scalafix --diff-base $(git merge-base origin/${{ github.event.pull_request.base.ref }} ${{ github.event.pull_request.head.sha }} || echo origin/${{ github.event.pull_request.base.ref }}) RestrictedImports SingleLetterIdentifiers UnorderedIteration"
      - run: echo "Previous step failed because the code is not formatted or violates coding quality expectations. Run 'sbt scalafmt Test/scalafmt' to format, and check the logs for scalafix violations."
        if: ${{ failure() }}

  validate-citation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@d8f85828214016ce6976e740b6e0504c0fdc4dbb # v5

  run-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Install php
        if: matrix.os == 'macos-latest'
        run: brew install php
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          cache: false
          go-version: 1.25
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          # SwiftAstGen-win.exe is built with Swift 6.1 and still loads the Swift runtime DLLs dynamically.
          # Swift has no stable ABI on Windows, so with a newer runtime it exits silently without any output.
          # Keep Windows on 6.1 until the Windows SwiftAstGen binary is rebuilt with a newer toolchain.
          swift-version: ${{ matrix.os == 'windows-latest' && '6.1' || '6.4' }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rust-src
      - name: Run tests
        run: sbt "testFull"

  integration-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Run integration tests
        run: sbt "c2cpg/stage ; integrationTests/testFull"

  test-scripts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Install coreutils
        if: matrix.os == 'macos-latest'
        run: brew install coreutils
      - name: Install php
        if: matrix.os == 'macos-latest'
        run: brew install php
      - name: Install Python dependencies for distribution test (Linux, MacOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          python -m pip install pexpect
      - name: Install Python dependencies for distribution test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install setuptools<81
          python -m pip install wexpect
      - name: Test distribution
        run: |
          sbt "joerncli/stage ; querydb/createDistribution"
          python -u ./testDistro.py

  test:
    timeout-minutes: 60
    needs: [validate-citation, lint-and-format, run-tests, integration-tests, test-scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check results of all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"' | paste -sd, -)
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi
          echo "All required jobs succeeded."
